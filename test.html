<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Contact</title>
    <link rel="stylesheet" href="./css/test.css" />
  </head>
  <body>
    <form class="form">
      <h2 class="form-title">Залиште свої дані, ми вам передзвонимо</h2>
      <label class="form-field">
        <input type="text" class="form-input" name="name" placeholder=" " />
        <span class="form-label">Ім'я</span>
        <svg class="icon-input" width="20" height="20" data-modal-close>
          <use href="./img/sprite.svg#icon-person"></use>
        </svg>
      </label>

      <label class="form-field">
        <input type="tel" class="form-input" name="name" placeholder=" " />
        <span class="form-label">Телефон</span>
        <svg class="icon-input" width="20" height="20" data-modal-close>
          <use href="./img/sprite.svg#icon-phone"></use>
        </svg>
      </label>
      <label class="form-field">
        <input type="email" class="form-input" name="name" placeholder=" " />
        <span class="form-label">Пошта</span>
        <svg class="icon-input" width="20" height="20" data-modal-close>
          <use href="./img/sprite.svg#icon-email"></use>
        </svg>
      </label>
      <label class="form-field">
        <textarea name="notes" class="form-textarea-input" rows="4" placeholder=" "></textarea>
        <span class="form-textarea-label">Коментар</span>
        <svg class="icon-textarea" width="20" height="20" data-modal-close>
          <use href="./img/sprite.svg#icon-pencil"></use>
        </svg>
      </label>

      <label>
        <input type="checkbox" class="form-chackbox" name="hobby" value="music" checked />
        Погоджуюся з розсилкою та приймаю Умови договору
      </label>

      <div class="form-button">
        <button type="submit" class="send-btn">Відправити</button>
      </div>
    </form>
  </body>
</html>
